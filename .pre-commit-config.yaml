# Runs the same tool versions as uv.lock, so local checks and CI agree.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: no-secrets
        name: block API keys and private keys
        entry: bash -c '! grep -nIE "gsk_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----" "$@"' --
        language: system
        types: [text]
