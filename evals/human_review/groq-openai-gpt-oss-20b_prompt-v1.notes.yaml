# Explanations shown in the eval report. Verdict files are never edited.
# Reviewers are listed only for rounds that are not a person's own declared review.
reviewers:
  1: second-AI reviewer (ChatGPT)
  2: second-AI reviewer (ChatGPT)
summary: >-
  **Rounds 1 and 2 were not human review.** Their verdicts came from a second-AI
  reviewer (ChatGPT), not from a person, so their numbers are AI-versus-AI
  agreement. Two models can share the same mistakes, so agreement does not show that
  either is right. Not recorded: the ChatGPT model version, the prompt, what it was
  shown and how its conversations were split. So these verdicts cannot be reproduced,
  and neither round can be called blind or independent. **Correction (2026-11-25):**
  both rounds were first published as human review. That was wrong. Earlier versions of
  this report and some commit messages still say so. The verdict files are unedited, so
  their field named `human` holds ChatGPT's verdict.
rounds:
  1: >-
    When this round was published, the rubric was reported as misapplied on some items:
    mixing up "faithful" with "helpful", and missing omitted key facts such as the 1.5%
    fee. It was described then as a person's own mistake, but the verdicts are
    ChatGPT's. No item-by-item check of that report is recorded. The verdicts are
    published unedited. This round cannot separate judge errors from second-reviewer
    errors. About the review tool in this round: its screen showed a one-line question
    for each verdict, not the full rubric (which says to ignore helpfulness when judging
    faithfulness), and showed the judge's verdict and reason after each answer. How much
    of that reached ChatGPT is not recorded.
  2: >-
    **Why this round was added:** the rubric problem reported for round 1 (see above).
    It uses 30 tasks that were not in round 1, one verdict each, chosen with a fixed
    seed. The review tool's screen showed the rubric text the judge gets and no judge
    verdict during the round. What was passed on to ChatGPT is not recorded, including
    whether it got the rubric and whether it had seen any judge output, such as that of
    round 1. So the reason for the higher agreement is unknown. This round does not
    replace round 1.
  3: >-
    The first round meant for a person. It uses 30 tasks that were in neither round 1 nor
    round 2, one verdict each, chosen with a fixed seed. `v1-035` was left out because
    the project documents discuss the judge's verdict on it. The screen shows the rubric
    text the judge gets and no judge verdict. At the start of each session the reviewer
    must confirm they are a person using no AI help; the tool saves that declaration
    with each verdict and cannot check it. Limits known before the round: there is one
    reviewer, who is the project owner. They have had access to this report and to the
    earlier rounds' results. Whether they had read anything about these 30 tasks is not
    recorded.
