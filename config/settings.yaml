# Default settings. Versioned in git, so every report can be traced back to them.
# Override any value with an environment variable: SUPPORTLOOP_<NAME IN CAPITALS>.
# Secrets never go here.

# --- LLM -------------------------------------------------------------------
llm_provider: groq                       # groq | ollama | fake
groq_base_url: https://api.groq.com/openai/v1
groq_generator_model: openai/gpt-oss-20b
# Judge is a different model family from the generator, so it does not grade its own style.
# It is a Groq "preview" model. Every report records which judge was configured.
groq_judge_model: qwen/qwen3.8-27b
ollama_base_url: http://localhost:11434
ollama_model: llama3.2:3b                # chosen by make benchmark-llm (DESIGN.md section 6)
ollama_num_ctx: 4096
llm_temperature: 0.0
llm_max_output_tokens: 1000
llm_timeout_seconds: 60
llm_max_retries: 5
llm_backoff_base_seconds: 1.0
llm_backoff_max_seconds: 60.0
# Never sleep longer than this for one retry. A longer "retry-after" means a daily
# quota is used up, so we stop and tell the caller instead of hanging for hours.
llm_max_retry_after_seconds: 90.0
llm_cache_enabled: false                 # off for live traffic, on for evals
llm_cache_path: data/cache/llm_cache.sqlite3
prompt_version: v1
messages_version: v1                     # fixed refusal and handoff texts
prompts_dir: app/prompts

# --- Retrieval ---------------------------------------------------------------
embedding_model: BAAI/bge-small-en-v1.5       # chosen by make benchmark-retrieval (DESIGN.md section 6)
reranker_model: BAAI/bge-reranker-v2-m3       # "none" switches reranking off
retrieval_device: cuda                        # cuda | cpu
kb_dir: data/kb
index_dir: data/index
chunk_max_words: 220
# BM25 was dropped after Phase 1: dense + reranker tied hybrid + reranker (DESIGN.md 6.3).
retrieval_mode: dense                         # dense | hybrid (BM25 + dense); both then rerank
bm25_top_k: 20
dense_top_k: 20
rrf_k: 60
rerank_candidates: 20
context_top_k: 4

# --- Chat behaviour ------------------------------------------------------------
# Calibrated on the dev retrieval split by make retrieval-eval (rule in benchmark.yaml).
# Only valid for the reranker above: another reranker scores on a different scale.
escalation_score_threshold: 0.0050
max_message_chars: 2000
history_turns: 3
max_conversations: 1000                  # conversations kept in memory
guardrails_path: config/guardrails.yaml
