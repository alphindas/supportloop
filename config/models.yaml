# Per-model settings, taken from each model card (read 2026-11-25).
embedders:
  Qwen/Qwen3-Embedding-0.6B:
    query_prompt_name: query          # prompt stored inside the model repo
    max_length: 512
  BAAI/bge-m3:
    max_length: 512
  BAAI/bge-small-en-v1.5:
    query_prefix: "Represent this sentence for searching relevant passages: "
    max_length: 512
rerankers:
  Qwen/Qwen3-Reranker-0.6B:
    max_length: 1024
    batch_size: 4
  BAAI/bge-reranker-v2-m3:
    max_length: 1024
    batch_size: 8
# Number format per device. On the GPU, half precision halves memory use.
# On the CPU we use float32: this laptop's CPU (i5-12450H) has no hardware support for
# bfloat16, and a quick test showed reranking about 4x slower with it. float32 needs
# about twice the RAM.
dtype:
  cuda: float16
  cpu: float32

# Extra request fields per chat model. They differ between model families.
llm:
  groq:
    # gpt-oss reasoning tokens count against the daily quota, so keep effort low and
    # do not send the reasoning text back.
    openai/gpt-oss-20b: {reasoning_effort: low, include_reasoning: false}
    openai/gpt-oss-120b: {reasoning_effort: low, include_reasoning: false}
    qwen/qwen3.8-27b: {reasoning_effort: none}
  ollama:
    # Thinking is switched off so a small local model replies in reasonable time.
    # num_gpu: 99 puts every layer on the GPU. Left to itself, Ollama kept 20-37% of each
    # model on the CPU even with over 1 GB of VRAM free. Each of these was checked to fit
    # with the GPU otherwise empty. It will NOT fit next to the retrieval models, so use
    # SUPPORTLOOP_RETRIEVAL_DEVICE=cpu with Ollama.
    qwen3.5:2b: {think: false, keep_alive: 10m, options: {num_gpu: 99}}
    llama3.2:3b: {keep_alive: 10m, options: {num_gpu: 99}}
    phi4-mini: {keep_alive: 10m, options: {num_gpu: 99}}
